[package]
name = "sm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"
